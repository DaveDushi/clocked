name: Mobile backend

on:
  push:
    paths: ['worker/**', '.github/workflows/mobile-backend.yml']
  pull_request:
    paths: ['worker/**', '.github/workflows/mobile-backend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Check types, accounting, and production Worker with local D1
        run: npm run verify
