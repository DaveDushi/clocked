<script>

{name:'Jordan Lee',email:'jordan@form.studio',role:'Worker',minutes:4050,days:[270,300,270,300,240]},
{name:'Casey Park',email:'casey@form.studio',role:'Worker',minutes:5370,days:[360,375,390,390,300]},
{name:'Riley Davis',email:'riley@form.studio',role:'Worker',minutes:5580,days:[390,390,390,420,300]},

];
const params=new URLSearchParams(location.search);
let accountType=document.documentElement.dataset.account||params.get('account')||'team';
if(!['team','personal'].includes(accountType))accountType='team';

if(!['timesheets','stats'].includes(pageView))pageView='timesheets';
let reportMonth=params.get('month')||'2026-09';
if(!['2026-09','2026-10'].includes(reportMonth))reportMonth='2026-09';

const samples={};
const arrow='<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>';
function duration(n){return Math.floor(n/60)+'h '+String(n%60).padStart(2,'0')+'m'}
function shortDuration(n){return n<60?n+'m':duration(n)}
function clock(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function parseClock(s){const [h,m]=s.split(':').map(Number);return h*60+m}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function monthLabel(month=reportMonth){return new Date(month+'-01T12:00:00').toLocaleDateString('en',{month:'long',year:'numeric'})}
function dayLabel(date,month=reportMonth){return new Date(month+'-'+String(date).padStart(2,'0')+'T12:00:00').toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'})}

function weekdays(month){const count=month==='2026-10'?18:30;return Array.from({length:count},(_,i)=>i+1).filter(date=>{const day=new Date(month+'-'+String(date).padStart(2,'0')+'T12:00:00').getDay();return day>0&&day<6})}
function generateSamples(month){
return members.map((m,index)=>{let dates=weekdays(month);if(index===4)dates=dates.slice(0,-4);
const early=(m.minutes-m.days.reduce((s,n)=>s+n,0))/15;
return dates.map((date,d)=>{const minutes=month==='2026-10'?(d<7?(Math.floor(early/7)+(d<early%7?1:0))*15:m.days[d-7]):m.days[d%5];const plans=[[30],[30,15],[60,30,15],[30],[15],[45,30],[30,15],[60,45]];const plan=date%5===0?[]:plans[index];const quarters=minutes/15;let cursor=540;
const sessions=Array.from({length:plan.length+1},(_,i)=>{const length=(Math.floor(quarters/(plan.length+1))+(i<quarters%(plan.length+1)?1:0))*15;const session={start:cursor,end:cursor+length,reason:i<plan.length?['Idle timeout','Manual clock-out','Computer asleep'][i%3]:'Manual clock-out',edited:index===1&&d===1&&i===0,editedBy:index===1&&d===1&&i===0?'manager':null};cursor=session.end+(plan[i]||0);return session});return {date,sessions}})})}
samples['2026-09']=generateSamples('2026-09');samples['2026-10']=generateSamples('2026-10');
function storedDays(m,month=reportMonth){return samples[month][members.indexOf(m)]}
function deriveDay(raw){const sessions=[...raw.sessions].sort((a,b)=>a.start-b.start);const breaks=sessions.slice(1).map((s,i)=>({start:sessions[i].end,end:s.start,cause:sessions[i].reason})).filter(b=>b.end>b.start);return {...raw,sessions,breaks,minutes:sessions.reduce((s,x)=>s+x.end-x.start,0),breakMinutes:breaks.reduce((s,x)=>s+x.end-x.start,0),start:sessions[0].start,end:sessions.at(-1).end}}
function recordedDays(m){return storedDays(m).map(deriveDay)}
function statsFor(scope){const days=scope.flatMap(recordedDays),worked=days.reduce((s,d)=>s+d.minutes,0),breaks=days.reduce((s,d)=>s+d.breakMinutes,0),count=days.reduce((s,d)=>s+d.breaks.length,0);return {worked,breaks,count,days:days.length,average:days.length?breaks/days.length:0,frequency:days.length?count/days.length:0}}
function median(values){const sorted=[...values].sort((a,b)=>a-b),mid=Math.floor(sorted.length/2);return sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2}
function scopeMembers(){return accountType==='personal'?[members[0]]:statsMember==='all'?members:[members[Number(statsMember)]]}

function teamView(){return '<div class="title-row"><h1>Team<span class="count">8 members</span></h1><button onclick="openInvite()">+ Invite member</button></div><div class="toolbar"><div class="toolbar-left">'+monthPicker()+'<label class="search"><input id="search" type="search" value="'+escapeHtml(query)+'" placeholder="Find a member" aria-label="Find a member" oninput="searchMembers(this.value)"></label></div><div class="team-actions"><button id="view-all" aria-pressed="false" onclick="toggleAll()">View all timesheets</button><button class="primary" onclick="openSendAll()">Send all ↗</button></div></div><div class="table-frame"><table><caption class="sr-only">Member timesheets for '+monthLabel()+'</caption><thead><tr><th>Member</th><th class="days-column">Days</th><th class="num">Worked time</th><th class="end"><span class="sr-only">Details</span></th></tr></thead><tbody id="members"></tbody><tfoot id="total"></tfoot></table></div><div class="bottom-row"><span>'+recordedThrough()+'</span><button class="text-button" onclick="openInvitations()">2 pending invitations ↗</button></div>'}
function renderRows(){const visible=visibleMembers();document.getElementById('members').innerHTML=visible.length?visible.map(({m,i})=>{const s=statsFor([m]);return '<tr class="member-row '+(expanded.has(i)?'open':'')+'"><td><button class="member-link" onclick="toggleMember('+i+')" aria-expanded="'+expanded.has(i)+'">'+m.name+(m.role==='Worker'?'':'<span class="role">'+m.role+'</span>')+'</button></td><td class="days-column">'+s.days+'</td><td class="num">'+duration(s.worked)+'</td><td><button class="expand" aria-label="Toggle '+m.name+' timesheet" aria-expanded="'+expanded.has(i)+'" onclick="toggleMember('+i+')">'+arrow+'</button></td></tr>'+(expanded.has(i)?'<tr id="detail-'+i+'"><td colspan="4" class="detail-cell">'+memberDetail(i)+'</td></tr>':'')}).join(''):'<tr><td colspan="4" class="empty">No members found.</td></tr>';document.getElementById('total').innerHTML=visible.length?'<tr class="total"><td colspan="2">'+(query?'Matching members':'Team total')+'</td><td class="num">'+duration(statsFor(visible.map(x=>x.m)).worked)+'</td><td></td></tr>':'';const all=expanded.size===members.length;document.getElementById('view-all').textContent=all?'Collapse all':'View all timesheets';document.getElementById('view-all').setAttribute('aria-pressed',all)}
function toggleMember(i){if(expanded.has(i))expanded.delete(i);else expanded.add(i);renderRows()}

function memberDetail(i){const m=members[i],s=statsFor([m]);return '<section class="detail" aria-label="'+m.name+' recorded days"><div class="inline-member-head"><strong>'+m.name+'</strong><small>'+monthLabel()+' · '+s.days+' days · '+duration(s.worked)+'</small></div><div class="daily-head"><span>Date</span><span class="session">Day span</span><span>Breaks</span><span>Worked</span></div>'+recordedDays(m).map(d=>'<button class="daily" onclick="openDay('+i+','+d.date+')" aria-label="View '+m.name+' sessions on '+dayLabel(d.date)+'"><span>'+dayLabel(d.date)+'</span><span class="session">'+clock(d.start)+' – '+clock(d.end)+'</span><span class="break-value">'+shortDuration(d.breakMinutes)+'</span><span class="hours">'+duration(d.minutes)+'</span></button>').join('')+'<div class="member-subtotal"><span>Member total</span><span class="mono">'+duration(s.worked)+' worked · '+duration(s.breaks)+' breaks</span></div><div class="detail-actions"><button class="text-button" onclick="openMemberSettings('+i+')">Member settings</button><small>Select a date to review or edit a session</small></div></section>'}
function personalView(){const days=recordedDays(members[0]),s=statsFor([members[0]]);return '<div class="personal-title"><h1>My timesheet</h1><p>Alex Morgan</p></div><div class="toolbar">'+monthPicker()+'<button class="primary" onclick="openPersonalSend()">Send timesheet ↗</button></div><div class="table-frame"><table><caption class="sr-only">Your worked time and breaks for '+monthLabel()+'</caption><thead><tr><th>Date</th><th class="span-column">Day span</th><th class="num">Breaks</th><th class="num">Worked time</th></tr></thead><tbody>'+days.map(d=>'<tr class="personal-row"><td><button class="day-link" onclick="openDay(0,'+d.date+')">'+dayLabel(d.date)+'</button></td><td class="session span-column">'+clock(d.start)+' – '+clock(d.end)+'</td><td class="num break-value">'+shortDuration(d.breakMinutes)+'</td><td class="num">'+duration(d.minutes)+'</td></tr>').join('')+'</tbody><tfoot><tr class="total"><td>Month total</td><td class="span-column"></td><td class="num">'+duration(s.breaks)+'</td><td class="num">'+duration(s.worked)+'</td></tr></tfoot></table></div><div class="bottom-row"><span>'+recordedThrough()+'</span><span>Select a date to review or edit</span></div>'+breakNote()}
function metric(label,value,hint){return '<div class="metric"><label>'+label+'</label><strong>'+value+'</strong><small>'+hint+'</small></div>'}
function statsView(){const scope=scopeMembers(),s=statsFor(scope),team=accountType==='team',all=team&&statsMember==='all';return '<div class="stats-top"><div><h1>'+(team?'Team stats':'My stats')+'</h1><p>Recorded hours and breaks for the selected month.</p></div></div><div class="stats-filters">'+monthPicker()+(team?'<label><span class="sr-only">Stats for</span><select aria-label="Stats for" onchange="statsMember=this.value;renderAccount()"><option value="all">All 8 members</option>'+members.map((m,i)=>'<option value="'+i+'" '+(statsMember===String(i)?'selected':'')+'>'+m.name+'</option>').join('')+'</select></label>':'')+'</div><div class="metrics">'+metric('Worked time',duration(s.worked),all?'All 8 members':scope[0].name)+metric('Break time',duration(s.breaks),s.count+' recorded gaps')+metric('Avg. break time / day',shortDuration(Math.round(s.average)),all?'Per recorded member-day':'Includes zero-break days')+metric('Breaks / day',s.frequency.toFixed(1),s.days+(all?' recorded member-days':' recorded days'))+'</div>'+(all?comparisonTable()+breakGrid():accountType==='personal'?workedCalendar(scope[0]):'<section class="stats-section"><div class="stats-section-head"><h2>Hours by day</h2><div class="legend"><span><i></i>Worked</span><span><i class="breaks"></i>Breaks</span></div></div>'+dailyChart(scope)+breakNote()+'</section>')}
function comparisonTable(){const rows=members.map((m,i)=>({m,i,s:statsFor([m])}));const avgMedian=median(rows.map(x=>x.s.average)),countMedian=median(rows.map(x=>x.s.frequency));const max=Math.max(...rows.map(x=>x.s.average));rows.sort((a,b)=>statsSort==='break-average'?b.s.average-a.s.average:statsSort==='break-count'?b.s.frequency-a.s.frequency:a.m.name.localeCompare(b.m.name));return '<section class="stats-section"><div class="stats-section-head"><h2>Breaks by member</h2><label><span class="sr-only">Sort members</span><select aria-label="Sort members" onchange="statsSort=this.value;renderAccount()"><option value="break-average" '+(statsSort==='break-average'?'selected':'')+'>Highest daily break time</option><option value="break-count" '+(statsSort==='break-count'?'selected':'')+'>Most breaks per day</option><option value="name" '+(statsSort==='name'?'selected':'')+'>Name</option></select></label></div><div class="stats-scroll"><table class="stats-table"><thead><tr><th>Member</th><th class="num">Worked</th><th class="num">Break time</th><th class="num">Breaks / day</th><th class="num">Avg. break time / day</th></tr></thead><tbody><tr class="reference-row"><td>Team median</td><td class="num">—</td><td class="num">—</td><td class="num">'+countMedian.toFixed(1)+'</td><td class="num">'+shortDuration(Math.round(avgMedian))+'</td></tr>'+rows.map(({m,i,s})=>'<tr><td><button onclick="reviewMember('+i+')" aria-label="Review '+m.name+' sessions">'+m.name+' ↗</button></td><td class="num">'+duration(s.worked)+'</td><td class="num break-value">'+duration(s.breaks)+'</td><td class="num">'+s.frequency.toFixed(1)+'</td><td class="num compare-average"><i style="width:'+(max?s.average/max*100:0)+'%"></i>'+shortDuration(Math.round(s.average))+'</td></tr>').join('')+'</tbody></table></div><p class="stats-scope-note">Averages include zero-break days and exclude days without sessions. Team median compares each member’s daily average.</p>'+policyNote()+'</section>'}
function breakGrid(){const dates=weekdays(reportMonth);return '<section class="stats-section"><div class="stats-section-head"><h2>Daily break time</h2><small>'+monthLabel()+'</small></div><div class="heat-scroll"><div class="heatmap" style="--days:'+dates.length+'"><div class="heat-row"><span></span>'+dates.map(d=>'<span class="heat-label">'+d+'</span>').join('')+'</div>'+members.map((m,i)=>{const days=recordedDays(m);return '<div class="heat-row"><button class="heat-name" onclick="reviewMember('+i+')">'+m.name+'</button>'+dates.map(date=>{const d=days.find(x=>x.date===date);return '<button class="heat-cell" '+(d?'onclick="openDay('+i+','+date+')" style="--strength:'+(d.breakMinutes===0?.04:Math.min(.22+d.breakMinutes/150*.65,.9))+'"':'disabled')+' aria-label="'+m.name+', '+dayLabel(date)+': '+(d?shortDuration(d.breakMinutes)+' break time':'no recorded sessions')+'" title="'+m.name+' · '+dayLabel(date)+' · '+(d?shortDuration(d.breakMinutes)+' breaks':'No recorded sessions')+'"></button>'}).join('')+'</div>'}).join('')+'</div></div><div class="heat-legend"><span>0m</span>'+[.04,.25,.5,.75,.9].map(a=>'<i style="background:rgba(242,169,80,'+a+')"></i>').join('')+'<span>120m+</span><span class="no-data">Striped = no recorded sessions</span></div><p class="stats-scope-note">Select a day to inspect its sessions. On smaller screens, scroll the grid horizontally.</p></section>'}

const workShades=['#f5dfbd','#dfb77c','#bc8849','#955d2b','#663b1c'];
function workedLevel(minutes){return minutes<120?0:minutes<240?1:minutes<360?2:minutes<480?3:4}
function calendarDays(){const first=new Date(reportMonth+'-01T12:00:00'),offset=(first.getDay()+6)%7,last=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();return {offset,last,weeks:Math.ceil((offset+last)/7)}}
function workedCalendar(member){const days=recordedDays(member),index=members.indexOf(member),calendar=calendarDays();return '<section class="stats-section"><div class="stats-section-head"><h2>Worked time by day</h2><small>'+monthLabel()+'</small></div><div class="work-calendar" style="--weeks:'+calendar.weeks+'" role="group" aria-label="Daily worked time. Darker amber means more worked time.">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((label,row)=>'<span class="calendar-day-label">'+label+'</span>'+Array.from({length:calendar.weeks},(_,week)=>{const date=week*7+row-calendar.offset+1;if(date<1||date>calendar.last)return '<span class="work-cell outside" aria-hidden="true"></span>';const day=days.find(d=>d.date===date),future=date>cutoff();if(!day)return '<button class="work-cell '+(future?'future':'empty')+'" disabled aria-label="'+dayLabel(date)+': '+(future?'not yet recorded':'no recorded sessions')+'" title="'+dayLabel(date)+' · '+(future?'Not yet recorded':'No recorded sessions')+'">'+date+'</button>';const level=workedLevel(day.minutes);return '<button class="work-cell" data-minutes="'+day.minutes+'" data-date="'+date+'" style="--shade:'+workShades[level]+';--cell-ink:'+(level<3?'#38220d':'#ffeed7')+'" onclick="openDay('+index+','+date+')" aria-label="'+dayLabel(date)+': '+duration(day.minutes)+' worked" title="'+dayLabel(date)+' · '+duration(day.minutes)+' worked">'+date+'</button>'}).join('')).join('')+'</div><div class="work-legend"><span>Less</span>'+workShades.map((shade,i)=>'<i style="background:'+shade+'" title="'+['Under 2 hours','2 to under 4 hours','4 to under 6 hours','6 to under 8 hours','8 hours or more'][i]+'"></i>').join('')+'<span>More</span><span class="legend-gap"></span><i class="empty-key"></i><span>No sessions</span></div><p class="calendar-note">Darker amber means more worked time, excluding breaks. Select a day to see its sessions and breaks.</p></section>'}

function dailyChart(scope){const count=cutoff(),entries=Array.from({length:count},(_,i)=>{const days=scope.map(m=>recordedDays(m).find(d=>d.date===i+1)).filter(Boolean);return {date:i+1,worked:days.reduce((s,d)=>s+d.minutes,0),breaks:days.reduce((s,d)=>s+d.breakMinutes,0)}});const peak=Math.max(...entries.map(e=>e.worked+e.breaks)),axis=Math.max(4,Math.ceil(peak/240)*4);return '<div class="hours-chart" role="img" aria-label="Daily worked hours and breaks for '+monthLabel()+'"><div class="chart-axis"><span>'+axis+'h</span><span>'+axis/2+'h</span><span>0</span></div><div class="chart-bars" style="grid-template-columns:repeat('+count+',minmax(0,1fr))">'+entries.map(e=>'<div class="chart-slot" title="'+dayLabel(e.date)+': '+duration(e.worked)+' worked, '+shortDuration(e.breaks)+' breaks"><div class="chart-stack"><div class="breaks" style="height:'+e.breaks/(axis*60)*178+'px"></div><div class="work" style="height:'+e.worked/(axis*60)*178+'px"></div></div><small>'+(count>22&&e.date%2===0?'':e.date)+'</small></div>').join('')+'</div></div><p class="chart-range">'+recordedThrough()+'</p>'}
function header(title){return '<div class="dialog-head"><h2 id="dialog-title">'+title+'</h2><button class="icon-button" onclick="closeDialog()" aria-label="'+(dialogStack.length>1?'Back':'Close dialog')+'">'+(dialogStack.length>1?'←':'✕')+'</button></div>'}
function openDialog(view,kind='dialog',nested=false){if(!nested){previousFocus=document.activeElement;dialogStack=[]}else if(dialogStack.length)dialogStack.at(-1).scroll=document.querySelector('.dialog')?.scrollTop||0;dialogStack.push({view,kind,scroll:0});drawDialog()}
function drawDialog(){if(!dialogStack.length){document.getElementById('overlay').innerHTML='';if(previousFocus?.isConnected)previousFocus.focus({preventScroll:true});return}const frame=dialogStack.at(-1),content=typeof frame.view==='function'?frame.view():frame.view;document.getElementById('overlay').innerHTML='<div class="overlay '+(frame.kind==='sheet'?'sheet-wrap':'')+'" onclick="if(event.target===this)closeDialog()"><section class="dialog '+(frame.kind==='sheet'?'sheet':frame.kind==='send'?'wide':'')+'" role="dialog" aria-modal="true" aria-labelledby="dialog-title">'+content+'</section></div>';document.querySelector('.dialog')?.scrollTo(0,frame.scroll);document.querySelector('.dialog button,.dialog input,.dialog select')?.focus({preventScroll:true})}
function closeDialog(){dialogStack.pop();drawDialog()}
function closeAll(){dialogStack=[];document.getElementById('overlay').innerHTML=''}
function feedback(id,message){document.getElementById(id).textContent=message}
function reviewMember(i){openDialog(()=>memberSheet(i),'sheet')}
function memberSheet(i){const m=members[i],s=statsFor([m]);return header(m.name)+'<p>'+monthLabel()+' · '+s.days+' recorded days</p><div class="sheet-summary"><div>Worked<strong>'+duration(s.worked)+'</strong></div><div>Avg. break time / day<strong>'+shortDuration(Math.round(s.average))+'</strong></div><div>Breaks / day<strong>'+s.frequency.toFixed(1)+'</strong></div></div>'+memberDetail(i)}
function dayContent(i,date){const m=members[i],day=recordedDays(m).find(d=>d.date===date);const entries=day.sessions.map((s,index)=>({...s,index,kind:'Work session'})).concat(day.breaks.map(b=>({...b,kind:'Break'}))).sort((a,b)=>a.start-b.start);return header(dayLabel(date))+'<p>'+m.name+'</p><div class="day-summary"><div>Worked time<strong>'+duration(day.minutes)+'</strong></div><div>Break time<strong>'+shortDuration(day.breakMinutes)+'</strong></div><div>Breaks<strong>'+day.breaks.length+'</strong></div></div>'+entries.map(e=>'<div class="timeline-row '+(e.kind==='Break'?'break-row':'')+' '+(e.edited?'edited':'')+'"><span class="time">'+clock(e.start)+' – '+clock(e.end)+'</span><div><span class="timeline-label">'+e.kind+'</span><small class="timeline-source">'+(e.kind==='Break'?e.cause:e.edited?'Edited by '+(e.editedBy||'manager'):'Recorded session')+'</small></div><span class="duration">'+shortDuration(e.end-e.start)+'</span>'+(e.kind==='Work session'?'<button class="text-button" onclick="editSession('+i+','+date+','+e.index+')" aria-label="Edit session '+clock(e.start)+' to '+clock(e.end)+'">Edit</button>':'<span></span>')+'</div>').join('')+'<div class="actions"><button onclick="editSession('+i+','+date+',-1)">+ Add missing session</button></div>'+breakNote()}
function openDay(i,date){openDialog(()=>dayContent(i,date),'dialog',dialogStack.length>0)}
function editSession(i,date,index){const day=storedDays(members[i]).find(d=>d.date===date),session=index<0?{start:day.sessions.at(-1).end+30,end:day.sessions.at(-1).end+90}:day.sessions[index];openDialog(()=>header(index<0?'Add missing session':'Edit session')+'<p>'+members[i].name+' · '+dayLabel(date)+'</p><form class="session-form" onsubmit="event.preventDefault();saveSession('+i+','+date+','+index+')"><div class="time-fields"><div><label for="entry-start">Clock-in</label><input id="entry-start" type="time" value="'+clock(session.start)+'" required></div><div><label for="entry-end">Clock-out</label><input id="entry-end" type="time" value="'+clock(session.end)+'" required></div></div><p class="mock-save">Changes apply to sample data in this preview only.</p><div class="form-error" id="edit-error" role="alert"></div><div class="actions"><button type="button" onclick="closeDialog()">Cancel</button><button class="primary">Save sample session</button></div></form>','dialog',true)}
function saveSession(i,date,index){const raw=storedDays(members[i]).find(d=>d.date===date),start=parseClock(document.getElementById('entry-start').value),end=parseClock(document.getElementById('entry-end').value);if(end<=start){feedback('edit-error','Clock-out must be after clock-in.');return}if(raw.sessions.some((s,n)=>n!==index&&start<s.end&&end>s.start)){feedback('edit-error','This overlaps another recorded session.');return}const next={start,end,reason:index<0?'Manual clock-out':raw.sessions[index].reason,edited:true,editedBy:accountType==='personal'?'account owner':'manager'};if(index<0)raw.sessions.push(next);else raw.sessions[index]=next;raw.sessions.sort((a,b)=>a.start-b.start);renderAccount();closeDialog()}
function openSendAll(){sendSelection=new Set(members.map((_,i)=>i));openDialog(()=>sendContent(),'send');updateSendSelection()}
function memberFlags(i){const m=members[i],days=recordedDays(m),reference=median(members.map(x=>recordedDays(x).length)),edits=days.flatMap(d=>d.sessions).filter(s=>s.edited).length;const facts=[];if(days.length<reference)facts.push(days.length+' days · team median '+reference);if(edits)facts.push(edits+' edited session'+(edits===1?'':'s'));return facts.join(' · ')}
function periodNotice(){return reportMonth==='2026-10'?'<p class="send-notice">October is still in progress. Includes sessions recorded through October 18.</p>':'<p class="complete-note">Complete month · '+monthLabel()+'</p>'}
function sendContent(){return header('Review team timesheets')+periodNotice()+'<form onsubmit="event.preventDefault();previewSendAll()"><label for="send-recipient">Recipient</label><input id="send-recipient" type="email" value="'+escapeHtml(teamRecipient)+'" required><div class="send-select-head"><label><input id="select-all-send" type="checkbox" checked onchange="selectAllSend(this.checked)">Select all members</label><span id="selected-count">8 selected</span></div><div class="send-members">'+members.map((m,i)=>{const s=statsFor([m]),facts=memberFlags(i);return '<label class="send-member"><input type="checkbox" data-send-member="'+i+'" checked onchange="selectSendMember('+i+',this.checked)"><span><strong>'+m.name+'</strong><small>'+s.days+' recorded days</small>'+(facts?'<small class="fact">'+facts+'</small>':'')+'</span><span class="mono">'+duration(s.worked)+'</span></label>'}).join('')+'</div><div class="send-total"><span>Selected worked time</span><strong id="send-total"></strong></div><p class="send-note">One timesheet per selected member. Pending invitations are excluded. Mockup only; no emails will be sent.</p><div id="send-feedback" class="feedback" role="status"></div><div class="send-footer"><div class="actions"><button type="button" onclick="closeDialog()">Cancel</button><button id="send-confirm" class="primary">Send 8 timesheets</button></div></div></form>'}
function selectSendMember(i,checked){if(checked)sendSelection.add(i);else sendSelection.delete(i);updateSendSelection()}
function selectAllSend(checked){sendSelection=checked?new Set(members.map((_,i)=>i)):new Set();document.querySelectorAll('[data-send-member]').forEach(el=>el.checked=checked);updateSendSelection()}
function updateSendSelection(){const size=sendSelection.size;document.getElementById('selected-count').textContent=size+' of 8 selected';document.getElementById('send-total').textContent=duration(statsFor([...sendSelection].map(i=>members[i])).worked);const button=document.getElementById('send-confirm');button.textContent='Send '+size+' timesheet'+(size===1?'':'s');button.disabled=size===0;const all=document.getElementById('select-all-send');all.checked=size===8;all.indeterminate=size>0&&size<8;feedback('send-feedback','')}
function previewSendAll(){if(!sendSelection.size)return;feedback('send-feedback','Preview complete. '+sendSelection.size+' selected sample timesheets for '+monthLabel()+' would be sent to '+document.getElementById('send-recipient').value+'. No email was sent.');document.getElementById('send-confirm').disabled=true}
function openPersonalSend(){openDialog(()=>header('Send your timesheet')+periodNotice()+'<div class="send-summary"><div><span>Worked time</span><strong>'+duration(statsFor([members[0]]).worked)+'</strong></div></div><form onsubmit="event.preventDefault();feedback(\'personal-send-feedback\',\'Preview complete. Your sample timesheet would be sent. No email was sent.\')"><label for="personal-send-recipient">Recipient</label><input id="personal-send-recipient" type="email" value="'+escapeHtml(personalRecipient)+'" required><p class="send-note">Mockup only. No emails will be sent.</p><div id="personal-send-feedback" class="feedback" role="status"></div><div class="actions"><button type="button" onclick="closeDialog()">Cancel</button><button class="primary">Send timesheet</button></div></form>')}
function openSettings(){openDialog(()=>settingsContent())}
function settingsContent(){const team=accountType==='team';return header(team?'Team settings':'Personal settings')+'<details class="settings-section"><summary>Timesheet delivery</summary><small>Monthly · Day 1 at 09:00 · Europe/Berlin</small><form onsubmit="event.preventDefault();saveDelivery()"><label for="recipient">Recipient</label><input id="recipient" type="email" value="'+escapeHtml(team?teamRecipient:personalRecipient)+'" required><label for="delivery-time">Send time</label><input id="delivery-time" type="time" value="09:00" required><p>'+(team?'Applies to all members.':'Includes your timesheet only.')+'</p><div id="delivery-feedback" class="feedback" role="status"></div><div class="actions"><button class="primary">Save sample settings</button></div></form></details>'+(team?'<details class="settings-section"><summary>Idle detection</summary><small>Team default · '+teamIdleMinutes+' minutes without input</small><form onsubmit="event.preventDefault();saveIdlePolicy()"><label for="idle-policy">Auto clock-out after</label><select id="idle-policy">'+[5,10,15,30].map(n=>'<option value="'+n+'" '+(n===teamIdleMinutes?'selected':'')+'>'+n+' minutes without keyboard or mouse input</option>').join('')+'</select><p>A shared timeout keeps future recording consistent across computers. Historical sample sessions retain their original 15-minute policy.</p><p class="mock-save">Prototype setting only. No desktop policy is changed.</p><div id="idle-feedback" class="feedback" role="status"></div><div class="actions"><button class="primary">Save sample policy</button></div></form></details><details class="settings-section"><summary>Default working hours</summary><small>Monday to Friday · 09:00 to 17:00</small>'+scheduleForm()+'</details><div class="settings-section"><h3>Team plan</h3><small>Free · 8 of 50 member seats used</small></div>':'')}
function saveDelivery(){if(accountType==='team')teamRecipient=document.getElementById('recipient').value;else personalRecipient=document.getElementById('recipient').value;feedback('delivery-feedback','Sample recipient saved for this preview only.')}
function saveIdlePolicy(){teamIdleMinutes=Number(document.getElementById('idle-policy').value);feedback('idle-feedback','Sample policy saved. Historical sessions are unchanged. No desktop settings were changed.')}
function scheduleForm(){return '<form onsubmit="event.preventDefault();feedback(\'schedule-feedback\',\'Preview saved. No working-hours policy changed.\')"><label for="shift-start">Shift starts</label><input id="shift-start" type="time" value="09:00" required><label for="shift-end">Shift ends</label><input id="shift-end" type="time" value="17:00" required><p>Uses each computer’s local time. Controls the after-hours prompt; tracking continues after the shift.</p><div id="schedule-feedback" class="feedback" role="status"></div><div class="actions"><button class="primary">Preview changes</button></div></form>'}
function openMemberSettings(i){openDialog(()=>header(members[i].name)+'<p>'+members[i].email+' · '+members[i].role+'</p><details class="settings-section"><summary>Working hours</summary><small>Using team default · Monday to Friday</small>'+scheduleForm()+'</details>','dialog',dialogStack.length>0)}
function openInvite(){openDialog(()=>header('Invite member')+'<form onsubmit="event.preventDefault();feedback(\'invite-feedback\',\'Invitation preview ready. No email was sent.\')"><label for="invite-email">Email</label><input id="invite-email" type="email" placeholder="name@company.com" required><label for="invite-role">Role</label><select id="invite-role"><option>Worker</option><option>Manager</option></select><p>Managers can review and adjust everyone’s hours.</p><div class="feedback" id="invite-feedback" role="status"></div><div class="actions"><button type="button" onclick="closeDialog()">Cancel</button><button class="primary">Preview invitation</button></div></form>')}
function openInvitations(){openDialog(()=>header('Pending invitations')+'<div class="invite-row"><div><strong>Morgan Ellis</strong><small>morgan@form.studio</small></div><small>Oct 16</small></div><div class="invite-row"><div><strong>Robin Kim</strong><small>robin@form.studio</small></div><small>Oct 17</small></div><p>These invitations are sample data.</p>')}
function openAccount(){openDialog(()=>header('Your account')+'<h3>Alex Morgan</h3><p>alex@form.studio</p><div class="account-info"><small>'+(accountType==='personal'?'Personal account':'Form Studio · Owner')+'</small></div>')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialogStack.length){e.preventDefault();closeDialog();return}if(e.key==='Tab'&&dialogStack.length){const elements=[...document.querySelectorAll('.dialog button,.dialog input,.dialog select,.dialog summary')].filter(el=>!el.disabled&&el.getClientRects().length);const first=elements[0],last=elements.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
if(window.top===window.self&&!document.documentElement.dataset.embedded)document.body.classList.add('standalone');
renderAccount();
</script></body></html>
