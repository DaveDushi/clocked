# Generate Clocked.xcodeproj with XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   cd mobile/ios && xcodegen generate
name: Clocked
options:
  bundleIdPrefix: com.daviddusi
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Clocked.xcconfig
  Release: Config/Clocked.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  ClockedCore:
    path: ClockedCore
targets:
  Clocked:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: ClockedCore
      - target: ClockedMonitor
      - target: ClockedReport
    settings:
      base:
        PRODUCT_NAME: Clocked
        PRODUCT_BUNDLE_IDENTIFIER: $(CLOCKED_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Clocked.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ClockedMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: MonitorExtension
        excludes: ["*.plist", "*.entitlements"]
    dependencies:
      - package: ClockedCore
    settings:
      base:
        PRODUCT_NAME: ClockedMonitor
        PRODUCT_BUNDLE_IDENTIFIER: $(CLOCKED_BUNDLE_ID).monitor
        INFOPLIST_FILE: MonitorExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: MonitorExtension/ClockedMonitor.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  ClockedReport:
    # Device Activity report extensions load only as ExtensionKit extensions
    # embedded in Extensions/, with EXAppExtensionAttributes and no NSExtension keys.
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: ReportExtension
        excludes: ["*.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_NAME: ClockedReport
        PRODUCT_BUNDLE_IDENTIFIER: $(CLOCKED_BUNDLE_ID).report
        INFOPLIST_FILE: ReportExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ReportExtension/ClockedReport.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  Clocked:
    build:
      targets:
        Clocked: all
        ClockedMonitor: all
        ClockedReport: all
